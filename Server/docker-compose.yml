# Tideng 本地開發環境
#
# Phase B（現在）：smart-launcher-v2 擋在前面模擬 SMART authorize/token/discovery，
#                  後端接本機的 Siming。
#
# Siming 不放進這個 compose：那會需要寫死它的 clone 路徑（build: ../../Siming），
# 而那個假設換一台機器就失效。改為各自獨立啟動，見 README。
#
# 切回公開 server 只需把 FHIR_SERVER_R4 改成 https://hapi.fhir.org/baseR4 再重啟。

services:
  smart-launcher:
    image: smartonfhir/smart-launcher-2:latest
    container_name: tideng-smart-launcher
    ports:
      - "8090:80"
    environment:
      NODE_ENV: production
      PORT: 80
      # 開發用，不是機密。正式部署必須換掉。
      SECRET: tideng-local-dev-secret
      # host.docker.internal 是容器連回 host 的位址（macOS／Windows 適用，Linux 需另外設定）
      FHIR_SERVER_R4: "http://host.docker.internal:8080"
      # 只留 R4，關掉其他版本避免 launcher UI 出現用不到的選項。
      FHIR_SERVER_R2: ""
      FHIR_SERVER_R3: ""
      # access token 壽命（分鐘）。設短一點，好驗證 refresh 流程。
      ACCESS_TOKEN_LIFETIME: 5
    restart: unless-stopped

