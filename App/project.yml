name: Tideng
options:
  bundleIdPrefix: com.shinrenpan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  FHIRCore:
    path: Packages/FHIRCore
  FHIRClient:
    path: Packages/FHIRClient
  SmartAuth:
    path: Packages/SmartAuth

targets:
  Tideng:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: FHIRCore
      - package: FHIRClient
      - package: SmartAuth
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # 必須是 YES。關掉的話只有舊的來源解析器在跑，而它只認得 Text("字面值")——
        # Button / Label / TextField / ContentUnavailableView / alert 全部看不到，
        # 活著的字串會被整批誤標成 stale。
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_LANGUAGE: en
        TARGETED_DEVICE_FAMILY: "2"   # iPad only
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Tideng
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # 支援四個方向。橫向仍是設計主軸（病房推車、護理站的實際擺法），
        # 但 iPadOS 26 起 UIRequiresFullScreen 已廢棄、方向限制即將被忽略，
        # 硬鎖只會落進 Apple 正在收窄的相容模式。改由版面自己撐住各種比例。
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 只放行本地網路（loopback、.local、無網域的 host），不是 NSAllowsArbitraryLoads。
        # 外部網域仍強制 HTTPS。醫院內網部署本來就常是 HTTP，所以這條在 Release 也留著——
        # 若要嚴格照 spec「Release 不含例外」，改成用 xcconfig 分 configuration。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.shinrenpan.Tideng
            CFBundleURLSchemes:
              - tideng
